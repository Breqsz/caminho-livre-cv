[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "caminho-livre-cv"
version = "0.1.0"
description = "Detector de barreiras de acessibilidade em calçadas (YOLO11) — GS FIAP 2026.2 Applied Computer Vision"
requires-python = ">=3.11"
license = { text = "AGPL-3.0-only" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "."]
